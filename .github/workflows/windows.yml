name: windows
# Real end-to-end run of install.ps1 on a Windows VM under Windows PowerShell 5.1
# (what students get by default), with the runner's own Node hidden so the
# per-user Node install + MCP hookup path is exercised for real.
on:
  workflow_dispatch:
  push:
    paths: ['install.ps1', '.github/workflows/windows.yml']

jobs:
  clean-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hide the runner's Node (simulate a fresh PC)
        shell: powershell
        run: |
          Rename-Item 'C:\Program Files\nodejs' 'nodejs.hidden'
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch 'node' }) -join ';'
          if (Get-Command node -ErrorAction SilentlyContinue) { throw 'node still visible' }
          "Path=$env:Path" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Run installer exactly like students (irm | iex), twice for idempotency
        shell: powershell
        env:
          CCS_REF: ${{ github.ref_name }}
        run: |
          Set-ExecutionPolicy -Scope Process Restricted -Force -ErrorAction SilentlyContinue
          1..2 | ForEach-Object {
            Write-Host "################ RUN $_ ################"
            Get-Content .\install.ps1 -Raw | Invoke-Expression
          }

      - name: New shell (PATH from registry) sees Claude + vault MCP connected
        shell: powershell
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path','User') + ';' + [Environment]::GetEnvironmentVariable('Path','Machine')
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch 'Program Files\\nodejs' }) -join ';'
          claude --version
          node --version
          (Get-Command node).Source
          $out = (claude mcp list 2>&1) -join "`n"
          Write-Host $out
          if ($out -notmatch 'obsidian-vault.*Connected') { throw 'vault MCP not connected' }
          claude plugin list
          $v = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Claude Code Starter\Start Here.md'
          if (-not (Test-Path $v)) { throw 'vault not installed' }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Obsidian\Obsidian.exe")) { throw 'Obsidian not installed' }
